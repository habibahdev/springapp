name: SpringApp - CI
on:
  pull_request:
    branches:
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    name: Standard Code
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: Generate Checkstyle report
        if: always()
        run: mvn -B checkstyle:checkstyle

      - name: Upload checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: backend/target/checkstyle/*
          retention-days: 15
          if-no-files-found: 'ignore'

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run unit tests
        run: mvn -B test

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Check Docker
        run: docker info

      - name: Run integration tests
        run: mvn -B -DskipTests verify